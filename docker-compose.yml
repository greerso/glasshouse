# Openship compose stack for Glasshouse (US OpenCouncil fork).
#
# Constraints imposed by Openship v0.5.0 (do not "fix" these away):
# - No `networks:` keys anywhere. Openship strips them at sync time — every
#   service joins one project network and resolves peers by service name.
# - No compose `profiles:`. Openship's service sync runs `docker compose
#   config`, which silently drops profile-gated services from the synced
#   stack.
# - Commands are exec-form arrays only (no shell strings).
services:
  web:
    # Openship v0.5.0 builds from the project dir (`.`), not a sibling
    # context. Prebuild on the thinkstation:
    #   docker build --build-arg USE_LOCAL_DB=false \
    #     --build-arg NEXT_PUBLIC_BUILD_COMMIT_SHA=$(git -C ../glasshouse-web rev-parse HEAD) \
    #     --build-arg NEXT_PUBLIC_REALM_DOMAIN=<the host this image will serve> \
    #     -t glasshouse-web:<sha> ../glasshouse-web
    # NEXT_PUBLIC_REALM_DOMAIN is inlined into the client bundle, so it must
    # name the deployment's own host (glasshouse.greerso.com on staging) or the
    # us realm's absolute URLs point at glasshouse.town. Today the entrypoint
    # runs `next build` at container start, so the service env var is what
    # actually reaches the build; the arg is what keeps this correct once that
    # build moves into the image (#4).
    # WEB_IMAGE is interpolated from this project's .env at `service sync`.
    image: ${WEB_IMAGE}
    ports: ["3100:3000"]
    env_file: .env.web
    environment: { TZ: America/Chicago }
    depends_on: [db, valkey]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The entrypoint runs `next build` at container start — minutes before
      # the port opens — so give it room before healthcheck failures count.
      start_period: 10m
  tasks:
    # TODO: Openship cannot build sibling ../glasshouse-tasks (same `.`
    # context bug as web). Switch to `image: ${TASKS_IMAGE}` and a
    # thinkstation-prebuilt tag before enabling this service.
    build: { context: ../glasshouse-tasks }
    ports: ["3005:3005"]
    env_file: .env.tasks
    environment: { TZ: America/Chicago }
    volumes:
      - ./volumes/tasks-data:/app/data
      - ./volumes/tasks-logs:/app/logs
    restart: unless-stopped
  db:
    image: postgis/postgis:16-3.5
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: glasshouse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: glasshouse
      TZ: America/Chicago
    # Named volume — /data is NFS (nolock); Postgres ESTALEs on that bind.
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ES_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: ["./volumes/esdata:/usr/share/elasticsearch/data"]
    restart: unless-stopped
  pgsync:
    # toluaina1/pgsync:latest is linux/arm64 only; thinkstation is x86_64.
    # Prebuild on the thinkstation (Openship deploy uses this tag, same
    # pattern as web — do not rely on a Hub pull of this name):
    #   docker build -t glasshouse-pgsync:7.3.0 ./pgsync
    # One-time bootstrap is a one-off on openship-glasshouse, not this
    # service command. Daemon flag is -d (pgsync 7.3.0).
    image: glasshouse-pgsync:7.3.0
    command: ["-d"]
    env_file: .env.pgsync
    depends_on: [db, es, valkey]
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: glasshouse
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: ["./volumes/miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8-alpine
    # Durable snapshotting — pgsync's checkpoint position (db 1) must survive
    # a restart, per Openship requirement.
    command: ["valkey-server", "--save", "60", "1"]
    # Named volume — same NFS ESTALE reason as db.
    volumes: ["valkeydata:/data"]
    restart: unless-stopped
  ingest:
    # Openship v0.5.0 builds from the project dir (`.`), not a sibling
    # context. Prebuild on the thinkstation:
    #   docker build -t glasshouse-ingest:<sha> ./ingest
    # INGEST_IMAGE is interpolated from this project's .env at `service sync`.
    image: ${INGEST_IMAGE}
    command: ["node", "dist/index.js"]
    env_file: .env.ingest
    environment: { TZ: America/Chicago }
    depends_on: [web, minio]
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
